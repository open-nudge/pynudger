---
name: "Security Semgrep Reusable"

on:
  workflow_call:
    inputs:
      name:
        description: "Name of the artifact (default: '' - no artifact upload)"
        type: "string"
        default: ""
      sarif:
        description: "Upload SARIF file to CodeQL"
        type: "boolean"
        default: false
      continue-on-error:
        description: "Whether to continue on error"
        type: "boolean"
        default: false
      file:
        description: "Name/path of the created SARIF file"
        type: "string"
        default: "semgrep.sarif"

permissions: {} # yamllint disable-line rule:braces

jobs:
  security-semgrep-reusable:
    name: "Security Semgrep Reusable"
    timeout-minutes: 10
    runs-on: "ubuntu-latest"
    permissions:
      # Required to upload SARIF file to CodeQL.
      actions: "read" # See: https://github.com/github/codeql-action/issues/2117
      # Require writing security events to upload SARIF file to security tab
      security-events: "write" # writing security events
      # Only need to read contents
      contents: "read"
    steps:
      - name: "Harden Runner"
        # yamllint disable rule:line-length
        uses: "step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0" # v2.12.0
        # yamllint enable rule:line-length
        with:
          # Container support is required for the Semgrep action.
          disable-sudo: true
          egress-policy: "block"
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            github.com:443
            objects.githubusercontent.com:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443
            semgrep.dev:443
      - name: "Checkout repository"
        # yamllint disable rule:line-length
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683" # v4.2.2
        # yamllint enable rule:line-length
        with:
          persist-credentials: false

      - name: "Run Semgrep"
        # yamllint disable rule:line-length
        uses: "docker://semgrep/semgrep:1.174.0@sha256:f1f7b71861c7b28b6e0f661225a2c4f58a484f5d0f182465c6d6b3b22f972ade"
        # yamllint enable rule:line-length
        # Keep these arguments aligned with the hook scan in
        # .pre-commit-config.yaml.
        with:
          entrypoint: "semgrep"
          args: >-
            scan
            --experimental
            --exclude=*pdm.lock
            --config=p/python
            --config=p/secrets
            --config=p/security-audit
            --config=p/ci
            --config=p/github-actions
            --config=p/bandit
            --config=p/gitleaks
            --error
            --metrics=off
            --severity=INFO
            --strict
            --sarif-output="${{ inputs.file }}"
            .
      - name: "Upload files"
        # yamllint disable rule:line-length
        uses: "open-nudge/opentemplate/.github/actions/sarif-upload@main" # zizmor: ignore[unpinned-uses]
        # yamllint enable rule:line-length
        with:
          name: "${{ inputs.name }}"
          file: "${{ inputs.file }}"
          sarif: "${{ inputs.sarif }}"
...
